<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover
    "
  >

  <title>Stickman Fight</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- HEADER -->

  <header class="topbar">

    <div class="brand">
      <span>STICKMAN</span>
      <strong>FIGHT</strong>
    </div>

    <div id="connectionStatus">
      CONNECTING
    </div>

  </header>


  <!-- LOBBY -->

  <section id="lobby">

    <div class="hero">

      <div class="stickmanLogo">

        <div class="head"></div>

        <div class="body"></div>

        <div class="arm arm1"></div>
        <div class="arm arm2"></div>

        <div class="leg leg1"></div>
        <div class="leg leg2"></div>

      </div>

      <h1>
        STICKMAN
        <span>FIGHT</span>
      </h1>

      <p>
        ONLINE 1V1 ARENA
      </p>

    </div>


    <div class="lobbyCard">

      <button
        id="createRoom"
        class="mainButton"
      >
        CREATE ROOM
      </button>

      <button
        id="showJoin"
        class="secondaryButton"
      >
        JOIN ROOM
      </button>


      <div
        id="joinPanel"
        hidden
      >

        <input
          id="roomInput"
          type="text"
          maxlength="6"
          placeholder="ROOM CODE"
          autocomplete="off"
          spellcheck="false"
        >

        <button
          id="joinRoom"
          class="mainButton"
        >
          JOIN
        </button>

      </div>


      <div id="roomInfo"></div>

      <div id="lobbyStatus">
        Create a room and invite another player.
      </div>

    </div>


    <div class="featureRow">

      <div class="feature">
        <b>👊</b>
        COMBAT
      </div>

      <div class="feature">
        <b>🔥</b>
        POWERS
      </div>

      <div class="feature">
        <b>⚡</b>
        DASH
      </div>

      <div class="feature">
        <b>📱</b>
        MOBILE
      </div>

    </div>

  </section>


  <!-- GAME -->

  <section
    id="game"
    hidden
  >

    <!-- HUD -->

    <div class="hud">

      <div class="fighterHud">

        <div class="fighterTitle">
          PLAYER 1
        </div>

        <div class="healthBar">
          <div id="hp1"></div>
        </div>

      </div>


      <div class="roundTimer">
        <span id="timer">
          90
        </span>
      </div>


      <div class="fighterHud fighter2">

        <div class="fighterTitle">
          PLAYER 2
        </div>

        <div class="healthBar">
          <div id="hp2"></div>
        </div>

      </div>

    </div>


    <div id="roomCodeDisplay">
      ROOM
    </div>


    <!-- ARENA -->

    <canvas id="arena"></canvas>


    <!-- PC HELP -->

    <div id="pcControls">

      <span id="controlText">
        Controls
      </span>

    </div>


    <!-- MOBILE -->

    <div id="mobileControls">

      <div class="leftControls">

        <button
          data-control="left"
          class="controlButton"
        >
          ◀
        </button>

        <button
          data-control="jump"
          class="controlButton"
        >
          ▲
        </button>

        <button
          data-control="right"
          class="controlButton"
        >
          ▶
        </button>

      </div>


      <div class="rightControls">

        <button
          data-action="attack"
          class="actionButton"
        >
          👊
        </button>

        <button
          data-control="block"
          class="actionButton"
        >
          🛡
        </button>

        <button
          data-action="kick"
          class="actionButton"
        >
          🦵
        </button>

        <button
          data-ability="fire"
          class="abilityButton fireButton"
        >
          🔥
        </button>

        <button
          data-ability="dash"
          class="abilityButton dashButton"
        >
          ⚡
        </button>

        <button
          data-ability="wind"
          class="abilityButton windButton"
        >
          🌪
        </button>

      </div>

    </div>


    <!-- ABILITY STATUS -->

    <div id="abilityStatus">

      <span id="fireCD">
        🔥 READY
      </span>

      <span id="dashCD">
        ⚡ READY
      </span>

      <span id="windCD">
        🌪 READY
      </span>

    </div>


    <!-- GAME OVER -->

    <div
      id="gameOverlay"
      hidden
    >

      <div class="gameOverCard">

        <div id="winnerText">
          YOU WIN
        </div>

        <div id="roundText">
          ROUND OVER
        </div>

        <button
          id="rematchButton"
          class="mainButton"
        >
          REMATCH
        </button>

        <button
          id="backButton"
          class="secondaryButton"
        >
          LEAVE
        </button>

      </div>

    </div>

  </section>

</div>


<script
  type="module"
  src="game.js"
></script>

</body>
</html>
